{% extends 'base.html' %}
{% load static %}


{% block title %}Tickets{% endblock %}
{% block head %}
<link rel="stylesheet" href="{% static 'css/styles.css' %}">

{% endblock %}

{% block content %}

<div class="titulo">
    <h1>Tickets</h1>
    <h4>Rellene el formulario</h4>

</div>

<form method="POST" action="/">

    <div class="empresa">
        <p>Empresa:</p>
        <input type="text" name="empresa" value="{{ user.empresa }}" readonly required>
    </div>

    <div class="contacto">
        <p>Contacto:</p>
        <input type="text" name="contacto" value="{{ user.username }}" readonly required>
    </div>

    <div class="tipo_dispositivo">
        <p>Tipo de dispositivo:</p>
        <select name="tipo_dispositivo" >
            <option value="">Selecciona un dispositivo</option>
            {% for dispositivo in dispositivos %}
            <option value="{{ dispositivo.id }}">{{ dispositivo.nombre }}</option>
            {% endfor %}

        </select>
    </div>

    <div class="id_dispositivo">
        <p>ID dispositivo:</p>
        <input type="number" name="id_dispositivo" >
    </div>

    <div class="observaciones">
        <p>Observaciones:</p>
        <textarea name="observaciones" rows="4" ></textarea>
        <!-- Subir archivo -->
        <input type="file" class="subir_archivo" name="archivo" accept="image/*">

    </div>

    <div class="portes">
        <p>Portes:</p>
        <select name="portes" >
            <option value="">Selecciona un tipo de portes</option>
            <option value="debido">Debido</option>
            <option value="pagado">Pagado</option>
        </select>
    </div>

    <div class="transporte">
        <p>Empresa de transporte:</p>
        <input type="text" name="transporte" >
    </div>

    <button id="enviar-ticket" type="submit">Enviar Ticket</button>
</form>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.querySelector('form');
    const fileInput = form.querySelector('input[name="archivo"]');
    const allowedExtensions = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'];
    const enviarButton = document.getElementById('enviar-ticket')

    const validFile = file => {
        if (!file) return true;
        const extension = file.name.split('.').pop().toLowerCase();
        return allowedExtensions.includes(extension);
    };

    const showError = message => {
        window.alert(message);
        console.error(message);
    };
    

    form.addEventListener('submit', async function (event) {
        event.preventDefault();

        const formData = new FormData(form);
        const file = fileInput.files[0];

        if (!validFile(file)) {
            showError('Formato de archivo inválido. Usa jpg, png, gif, bmp o webp.');
            return;
        }

        enviarButton.disabled = true;
        enviarButton.textContent = 'Creando ticket...';

        try {
            const response = await fetch(form.action, {
                method: 'POST',
                body: formData,
                credentials: 'same-origin'
            });

            const data = await response.json();

            if (!response.ok) {
                showError(
                    data.error ||
                    data.message ||
                    'No se pudo crear el ticket.'
                );
                return;
            }

            window.alert(data.message);
            window.location.href = "/";


        } catch (error) {
            console.error('Error al crear el ticket:', error);
            showError('Error al crear el ticket.');
        } finally {
            enviarButton.disabled = false;
            enviarButton.textContent = 'Crear ticket';
        }
    });

});
</script>

{% endblock %}
